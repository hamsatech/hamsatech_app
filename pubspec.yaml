name: hamsatech
description: "Shooting Training Mental Performance App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hamsatech_design_system:
    path: packages/hamsatech_design_system
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^8.0.0
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.69.0
  intl: ^0.19.0
  uuid: ^4.5.1
  google_fonts: ^8.1.0
  flutter_social_button: ^1.1.6+1
  font_awesome_flutter: ^10.8.0
  flutter_svg: ^2.0.10+1
  flutter_otp_text_field: ^1.5.1+1
  permission_handler: ^11.1.0
  dio: ^5.7.0
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logos/astra_launcher.png"
  min_sdk_android: 21
  adaptive_icon_background: "#061E26"
  adaptive_icon_foreground: "assets/logos/astra_launcher_fg.png"
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/logos/
    - assets/onboarding/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: PT Serif
      fonts:
        - asset: assets/fonts/PTSerif-Regular.ttf
          weight: 400
