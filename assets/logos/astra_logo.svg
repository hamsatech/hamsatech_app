<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 85">
  <defs>
    <linearGradient id="astra-lg" x1="0.5" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#BEF8FF"/>
      <stop offset="50%"  stop-color="#2F7E8F"/>
      <stop offset="100%" stop-color="#1D6070"/>
    </linearGradient>
    <linearGradient id="astra-rg" x1="0.5" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#4FD8EC"/>
      <stop offset="50%"  stop-color="#2F7E8F"/>
      <stop offset="100%" stop-color="#0D3A45"/>
    </linearGradient>
    <linearGradient id="astra-bg" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#4FD8EC"/>
      <stop offset="50%"  stop-color="#2F7E8F"/>
      <stop offset="100%" stop-color="#1D6070"/>
    </linearGradient>
    <radialGradient id="astra-ag" cx="50" cy="0" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#BEF8FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#BEF8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Left arm -->
  <path d="M50,0 C40,6.8 20,34 2,85 L20,85 C30,39.1 46,15.3 50,18.7 Z"
        fill="url(#astra-lg)"/>

  <!-- Right arm -->
  <path d="M50,0 C60,6.8 80,34 98,85 L80,85 C70,39.1 54,15.3 50,18.7 Z"
        fill="url(#astra-rg)"/>

  <!-- Crossbar -->
  <path d="M26.5,46.5 L73.5,46.5 L72.5,61 L27.5,61 Z"
        fill="url(#astra-bg)"/>

  <!-- Highlight edge – left outer -->
  <path d="M50,0 C40,6.8 20,34 2,85"
        fill="none" stroke="#BEF8FF" stroke-width="1.2"
        stroke-opacity="0.55" stroke-linecap="round"/>

  <!-- Highlight edge – right outer -->
  <path d="M50,0 C60,6.8 80,34 98,85"
        fill="none" stroke="#BEF8FF" stroke-width="1.2"
        stroke-opacity="0.55" stroke-linecap="round"/>

  <!-- Apex glow -->
  <circle cx="50" cy="0" r="18" fill="url(#astra-ag)"/>
</svg>
